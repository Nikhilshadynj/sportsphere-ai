name: CI

on:
  pull_request:
    branches:
      - main
      - deployment/aws-ci-cd

  push:
    branches:
      - main
      - deployment/aws-ci-cd

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Build AI Service image
        run: |
          docker build \
            -f services/ai-service/Dockerfile.prod \
            -t sportsphere-ai-service:ci \
            services/ai-service

      - name: Build API Gateway image
        run: |
          docker build \
            -f services/api-gateway/Dockerfile.prod \
            -t sportsphere-api-gateway:ci \
            services/api-gateway

      - name: Build Auth Service image
        run: |
          docker build \
            -f services/auth-service/Dockerfile.prod \
            -t sportsphere-auth-service:ci \
            services/auth-service

      - name: Build Match Service image
        run: |
          docker build \
            -f services/match-service/Dockerfile.prod \
            -t sportsphere-match-service:ci \
            services/match-service

      - name: Build Frontend image
        run: |
          docker build \
            -f apps/frontend/Dockerfile.prod \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api \
            -t sportsphere-frontend:ci \
            .
  build-and-push-images:
    name: Build and Push Images to ECR
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            repository: sportsphere/frontend
            dockerfile: apps/frontend/Dockerfile.prod
            context: .
            build_args: |
              NEXT_PUBLIC_API_URL=/api

          - service: api-gateway
            repository: sportsphere/api-gateway
            dockerfile: services/api-gateway/Dockerfile.prod
            context: services/api-gateway

          - service: auth-service
            repository: sportsphere/auth-service
            dockerfile: services/auth-service/Dockerfile.prod
            context: services/auth-service

          - service: ai-service
            repository: sportsphere/ai-service
            dockerfile: services/ai-service/Dockerfile.prod
            context: services/ai-service

          - service: match-service
            repository: sportsphere/match-service
            dockerfile: services/match-service/Dockerfile.prod
            context: services/match-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: sportsphere-${{ matrix.service }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: image
        shell: bash
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "latest=${REGISTRY}/${{ matrix.repository }}:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${REGISTRY}/${{ matrix.repository }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ steps.image.outputs.latest }}
            ${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push-images
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: sportsphere-ec2-deployment
          mask-aws-account-id: true

      - name: Create SSM deployment parameters
        shell: bash
        run: |
          cat > ssm-parameters.json <<'JSON'
          {
            "commands": [
              "set -e",
              "cd /home/ec2-user/sportsphere",
              "AWS_REGION=ap-south-1",
              "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)",
              "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker compose --env-file .env.docker -f docker-compose.prod.yml -f docker-compose.ec2.yml pull frontend api-gateway auth-service ai-service match-service",
              "docker compose --env-file .env.docker -f docker-compose.prod.yml -f docker-compose.ec2.yml up -d --no-deps --force-recreate frontend api-gateway auth-service ai-service match-service",
              "docker image prune -f",
              "docker compose --env-file .env.docker -f docker-compose.prod.yml -f docker-compose.ec2.yml ps"
            ]
          }
          JSON

      - name: Send deployment command to EC2
        id: deploy
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Sportsphere commit ${GITHUB_SHA}" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: ${COMMAND_ID}"

      - name: Wait for EC2 deployment
        shell: bash
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          echo "Waiting for deployment command to finish..."

          for attempt in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt ${attempt}: ${STATUS}"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: ${STATUS}"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{
                    Status:Status,
                    StandardOutput:StandardOutputContent,
                    StandardError:StandardErrorContent
                  }'

                exit 1
                ;;
            esac

            if [ "$attempt" -eq 60 ]; then
              echo "Deployment did not complete within the expected time."
              exit 1
            fi

            sleep 10
          done

      - name: Show deployment output
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{
              Status:Status,
              StandardOutput:StandardOutputContent,
              StandardError:StandardErrorContent
            }'