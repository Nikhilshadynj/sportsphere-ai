services:

  mongodb:
    image: mongo:7
    container_name: sportsphere-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password  
    volumes:
      - ./services/auth-service/data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7
    container_name: sportsphere-redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sportsphere-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"  

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sportsphere-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
    - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:        